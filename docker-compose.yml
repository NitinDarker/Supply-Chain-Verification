services:
  mongodb:
    image: mongo:7
    container_name: velen-mongo
    ports:
      - "27017:27017"
    volumes:
      - velen-mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: velen-redis
    ports:
      - "6379:6379"
    volumes:
      - velen-redis-data:/data

  backend1:
    build:
      context: ./backend
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/velen
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:3000
      LOG_DIR: /logs/backend1
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./logs/backend1:/logs/backend1

  backend2:
    build:
      context: ./backend
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/velen
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:3000
      LOG_DIR: /logs/backend2
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./logs/backend2:/logs/backend2

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "5000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend1
      - backend2

volumes:
  velen-mongo-data:
  velen-redis-data:
